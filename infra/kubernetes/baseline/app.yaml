apiVersion: v1
kind: Namespace
metadata:
  name: taskboard-baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard
  namespace: taskboard-baseline
spec:
  replicas: 1
  selector:
    matchLabels: {app: taskboard}
  template:
    metadata:
      labels: {app: taskboard}
    spec:
      containers:
        - name: taskboard
          image: taskboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard
  namespace: taskboard-baseline
spec:
  type: NodePort
  selector: {app: taskboard}
  ports:
    - port: 8080
      targetPort: 8080
